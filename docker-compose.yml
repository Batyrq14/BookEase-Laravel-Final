services:
  app:
    image: serversideup/php:8.4-fpm-nginx
    container_name: bookease-app
    working_dir: /var/www/html
    environment:
      SSL_MODE: "off"
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8080"
    depends_on:
      pgsql:
        condition: service_healthy

  node:
    image: node:20-alpine
    container_name: bookease-node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    profiles: ["build"]

  pgsql:
    image: postgres:16-alpine
    container_name: bookease-pgsql
    environment:
      POSTGRES_DB: bookease
      POSTGRES_USER: bookease
      POSTGRES_PASSWORD: secret
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookease -d bookease"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgsql_data:
